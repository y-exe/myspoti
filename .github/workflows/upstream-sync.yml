name: Upstream sync

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Signing key
        env:
          SIGNING_KEY: ${{ secrets.UPSTREAM_SYNC_SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY"
          install -m 700 -d "$RUNNER_TEMP/signing"
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/signing/key"
          chmod 600 "$RUNNER_TEMP/signing/key"
          git config user.name 'yexe'
          git config user.email 'y.exe.1201@proton.me'
          git config gpg.format ssh
          git config user.signingkey "$RUNNER_TEMP/signing/key"
          git config gpg.ssh.allowedSignersFile "$GITHUB_WORKSPACE/.github/sync-allowed-signers"

      - name: Apply fork to latest upstream
        id: sync
        run: |
          BEFORE="$(git rev-parse HEAD)"
          BASE="$(git rev-parse HEAD^)"
          git fetch --no-tags https://github.com/kota-zo/myspoti.git main
          UPSTREAM="$(git rev-parse FETCH_HEAD)"
          git fetch https://github.com/kota-zo/myspoti.git 'refs/tags/*:refs/tags/*'
          if [ "$UPSTREAM" = "$BASE" ]; then
            # Amend, rather than add a commit, to keep the scheduled workflow active.
            LAST="$(git log -1 --format=%ct)"
            if (( $(date +%s) - LAST >= 30 * 86400 )); then
              git commit --amend --no-edit -S
              git verify-commit HEAD
              git push --force-with-lease="refs/heads/main:$BEFORE" origin HEAD:main
            fi
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git merge-base --is-ancestor "$BASE" "$UPSTREAM"
          # Reapply the one fork commit; never resolve conflicts by dropping either side.
          if ! git rebase --gpg-sign --onto "$UPSTREAM" "$BASE" main; then
            git rebase --abort
            echo '::error::Upstream conflicts with fork changes; main and its release were preserved.'
            exit 1
          fi
          test "$(git rev-parse HEAD^)" = "$UPSTREAM"
          git verify-commit HEAD
          git push --force-with-lease="refs/heads/main:$BEFORE" origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Build and release
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fork-release.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/signing/key"
